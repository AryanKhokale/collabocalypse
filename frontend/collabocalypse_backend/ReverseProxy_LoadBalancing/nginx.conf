
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # WebSocket Upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi_cluster {
        # Using 'least_conn' ensures that if one port is busy, then it will route to the next least busy port. For revision prefer nbk!
        # Nginx tries another one instead of being stuck on 6000, other requests were waiting!
        # This also prevented the wait, faced on port 6000 alone
        least_conn; 
        server host.docker.internal:1000;
        server host.docker.internal:2000;
        server host.docker.internal:3000;
        server host.docker.internal:4000;
        server host.docker.internal:5000;
        server host.docker.internal:6000;
        server host.docker.internal:7000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_cluster;
            
           
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}